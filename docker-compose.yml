services:
  db:
    image: postgres:16
    container_name: copy_mkt_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: copy_mkt
    ports:
      - "5434:5432"
    volumes:
      - pgdata_copy_mkt:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d copy_mkt"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - copy_mkt_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: copy_mkt_backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: copy_mkt
      CORS_ORIGIN: http://localhost:8888
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash-8b}
    ports:
      - "8081:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - copy_mkt_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8081"
    container_name: copy_mkt_frontend
    ports:
      - "8888:5173"
    depends_on:
      - backend
    networks:
      - copy_mkt_network
    restart: unless-stopped

networks:
  copy_mkt_network:
    driver: bridge

volumes:
  pgdata_copy_mkt:


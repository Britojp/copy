services:
  db:
    image: postgres:16-alpine
    container_name: copy_mkt_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: copy_mkt
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "5434:5432"
    volumes:
      - pgdata_copy_mkt:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d copy_mkt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - copy_mkt_network
    restart: unless-stopped
    shm_size: 256mb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0

networks:
  copy_mkt_network:
    driver: bridge

volumes:
  pgdata_copy_mkt:



